{% if messages %}<section class="notificaciones" aria-label="Avisos" aria-live="polite">
    {% for mensaje in messages %}<div class="notificacion notificacion--{{ mensaje.tags }}" role="{% if mensaje.tags == 'error' %}alert{% else %}status{% endif %}"><p>{{ mensaje }}</p><button type="button" data-cerrar-aviso aria-label="Cerrar aviso">×</button></div>{% endfor %}
  </section>{% endif %}
